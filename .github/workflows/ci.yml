name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Shared Go CI: test, vet, fmt, lint, govulncheck, replace check, and the
  # full-history gitleaks secret scan.
  ci:
    uses: infodancer/workflows/.github/workflows/go-ci.yml@v0

  # go-ci tests the current stable release with cgo. This repo also supports
  # the previous release and pure-Go builds, which go-ci does not cover.
  compat:
    name: compat (Go ${{ matrix.go }}, CGO_ENABLED=0)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: [stable, oldstable]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      - name: build (CGO_ENABLED=0)
        env:
          CGO_ENABLED: '0'
        run: |
          go build ./cmd/dictad
          go build ./cmd/dicta
      - name: test (CGO_ENABLED=0)
        env:
          CGO_ENABLED: '0'
        run: go test -count=1 ./...
