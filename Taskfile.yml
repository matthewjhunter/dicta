version: '3'

# D13 — daemon and CLI must build with CGO_ENABLED=0 to keep the pure-Go
# invariant (and keep MemoryDenyWriteExecute=true viable in the systemd
# unit). The race detector requires CGo, so test:race overrides this.

env:
  CGO_ENABLED: '0'

vars:
  VERSION: '{{.VERSION | default "0.1.0-dev"}}'
  LDFLAGS: -s -w
  BIN: bin

tasks:
  default:
    desc: Show available tasks.
    cmds:
      - task --list

  build:
    desc: Build dictad and dicta (pure Go, static).
    deps: [dictad, dicta]

  build:all:
    desc: Build dictad, dicta, AND dicta-preview (preview needs CGo + Wayland/GLES dev headers).
    deps: [build, preview]

  dictad:
    desc: Build the dictad daemon.
    cmds:
      - mkdir -p {{.BIN}}
      - go build -ldflags='{{.LDFLAGS}}' -o {{.BIN}}/dictad ./cmd/dictad
    sources:
      - cmd/dictad/**/*.go
      - internal/**/*.go
      - go.mod
      - go.sum
    generates:
      - '{{.BIN}}/dictad'

  dicta:
    desc: Build the dicta CLI.
    cmds:
      - mkdir -p {{.BIN}}
      - go build -ldflags='{{.LDFLAGS}}' -o {{.BIN}}/dicta ./cmd/dicta
    sources:
      - cmd/dicta/**/*.go
      - internal/**/*.go
      - go.mod
      - go.sum
    generates:
      - '{{.BIN}}/dicta'

  preview:
    desc: |
      Build the clip-mode preview panel (CGo + Wayland/xkbcommon/GLES/EGL/
      libvulkan headers required at build time). The nox11 tag drops the
      X11 backend so libxkbcommon-x11 and libxcb-* aren't needed.
      D13's pure-Go invariant does NOT apply to dicta-preview (it's a
      separate process boundary; see SECURITY.md item 6).
    env:
      CGO_ENABLED: '1'
    cmds:
      - mkdir -p {{.BIN}}
      - go build -tags nox11 -ldflags='{{.LDFLAGS}}' -o {{.BIN}}/dicta-preview ./cmd/dicta-preview
    sources:
      - cmd/dicta-preview/**/*.go
      - proto/**/*.go
      - go.mod
      - go.sum
    generates:
      - '{{.BIN}}/dicta-preview'

  test:
    desc: Run unit tests.
    cmds:
      - go test ./...

  test:race:
    desc: Run tests with the race detector (requires CGo).
    env:
      CGO_ENABLED: '1'
    cmds:
      - go test -race ./...

  vet:
    desc: Run go vet on all packages.
    cmds:
      - go vet ./...

  tidy:
    desc: Run go mod tidy.
    cmds:
      - go mod tidy

  clean:
    desc: Remove build artifacts.
    cmds:
      - rm -rf {{.BIN}}

  check:
    desc: Run vet, tests, and race-tests in one shot.
    cmds:
      - task: vet
      - task: test
      - task: test:race

  install:user:
    desc: |
      Install dictad + dicta + dicta-preview into ~/.local/bin and the
      systemd user unit into ~/.config/systemd/user. Run `task build:all`
      first. Does NOT enable the unit — run `systemctl --user enable
      --now dictad.service` separately.
    cmds:
      - install -d ~/.local/bin
      - install -m 0755 {{.BIN}}/dictad ~/.local/bin/dictad
      - install -m 0755 {{.BIN}}/dicta ~/.local/bin/dicta
      - install -m 0755 {{.BIN}}/dicta-preview ~/.local/bin/dicta-preview
      - install -d ~/.config/systemd/user
      - install -m 0644 packaging/systemd/dictad.service ~/.config/systemd/user/dictad.service
      - systemctl --user daemon-reload

  install:keybindings:
    desc: |
      Bind Pause -> type-mode toggle and Scroll Lock -> clip-mode toggle
      via GNOME's custom-keybindings (gsettings). Idempotent; preserves
      any other custom-keybindings already configured. Each binding wraps
      `systemctl --user start dictad` so the daemon auto-launches on
      first press. Run `scripts/setup-keybindings-gnome.sh --uninstall`
      to remove. GNOME-only for now; bind manually under other
      compositors (see CONFIGURATION.md).
    cmds:
      - scripts/setup-keybindings-gnome.sh
